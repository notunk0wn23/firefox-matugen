name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run server tests
        run: python server/test_main.py

  extension:
    name: extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run background script tests
        run: node test/background.test.mjs
      - name: Lint the extension
        run: npx --yes web-ext@8.3.0 lint --source-dir=src --output=text
